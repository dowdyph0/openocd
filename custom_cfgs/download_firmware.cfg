init
jtagspi_init xc7.spi bscan_spi_xc7a75t.bit

set output_file "firwmare_dump.bin"
# Define SPI size (8MB) and fixed page size (255 bytes)
set spi_size 0x800000  ;# 8MB
set page_size 255

# Open a file for writing in binary mode
set fd [open $output_file wb]

# Read in chunks, adjusting the final read if necessary
for {set addr 0} {$addr < $spi_size} {} {
    # Determine how many bytes remain to be read
    set remaining [expr {$spi_size - $addr}]
    set current_page_size [expr {$remaining < $page_size ? $remaining : $page_size}]
    
    puts "Reading $current_page_size bytes at offset: [format 0x%06X $addr]"

    # Read SPI flash using OpenOCD's JTAG SPI command with the current page size
    set response [jtagspi cmd xc7.spi $current_page_size 0x3 \
                  [expr {($addr >> 16) & 0xFF}] \
                  [expr {($addr >> 8) & 0xFF}] \
                  [expr {$addr & 0xFF}] ]
    
    # Extract the actual data bytes from the response
    if {[regexp {spi: .* -> ([0-9a-f ]*)} $response match data_bytes]} {
        set byte_array [split $data_bytes " "]
        set raw_data ""
        foreach byte_val $byte_array {
            if {[scan $byte_val %x intValue] == 1} {
                append raw_data [binary format c $intValue]
            }
        }
        puts -nonewline $fd $raw_data
    } else {
        puts "Warning: Unexpected response format at offset [format 0x%06X $addr]!"
    }

    # Increment the address by the number of bytes read
    incr addr $current_page_size
}

close $fd
puts "Dump completed! Saved to: $output_file"
exit
